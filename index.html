<html lang="en">
<head>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#ffffff",
                        foreground: "#111111",
                        muted: "#f4f4f4",
                        border: "#e5e5e5",
                        clay: "#b85f4d"
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'ui-serif', 'Georgia', '"Times New Roman"', 'serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', '"SF Mono"', 'Menlo', 'Consolas', 'monospace'],
                    },
                    transitionTimingFunction: {
                        'out-expo': 'cubic-bezier(0.16, 1, 0.3, 1)',
                    }
                },
            },
        }
    </script>
    <style>
        /* =========================================================
           DESIGN TOKENS — single source of truth for motion & colour
           ========================================================= */
        :root {
            --ink: #111111;
            --clay: #b85f4d;
            --line: #e5e5e5;

            /* One easing family across CSS + JS keeps motion coherent */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

            --dur-fast: 180ms;
            --dur-base: 320ms;
            --dur-slow: 600ms;

            /* Just clears the scrolled header bar; each section's own top padding
               supplies the breathing room below it. */
            --header-h: 88px;
        }

        html {
            /* Anchored sections stop clear of the fixed header */
            scroll-padding-top: var(--header-h);
            /* Reserve the scrollbar gutter permanently so locking body scroll
               for a modal doesn't shift the whole page sideways. */
            scrollbar-gutter: stable;
        }

        body {
            background-color: #ffffff;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-synthesis-weight: none;
            overflow-x: hidden;
        }

        /* Inter reads better with slightly opened tracking at small sizes
           and tightened tracking at display sizes — handled per-element. */
        h1, h2, h3 { font-feature-settings: "kern" 1, "liga" 1, "calt" 1; }

        /* Aligned figures for anything numeric (estimator HUD, stats) */
        .tnum { font-variant-numeric: tabular-nums; }

        ::selection {
            background-color: var(--clay);
            color: #ffffff;
        }

        /* ---------- Focus: invisible for mouse, unmistakable for keyboard ---------- */
        :focus { outline: none; }
        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 3px;
            border-radius: 6px;
        }
        /* The nav morphs behind overflow:hidden, so its ring has to sit inside. */
        header nav :focus-visible { outline-offset: -3px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ---------- Logo ---------- */
        .logo-invert { filter: invert(1); }
        .site-logo {
            display: block;
            height: 36px;
            width: auto;
            object-fit: contain;
        }
        @media (min-width: 900px) {
            .site-logo { height: 42px; }
        }

        /* ---------- Range slider: fully custom, monochrome ---------- */
        input[type=range].lr-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            background: transparent;
            cursor: pointer;
        }
        input[type=range].lr-range::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(to right, var(--ink) 0 var(--range-fill, 0%), #e2e2e2 var(--range-fill, 0%) 100%);
        }
        input[type=range].lr-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 18px;
            width: 18px;
            margin-top: -7px;
            border-radius: 999px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 1px 2px rgba(0,0,0,0.14), 0 4px 12px -2px rgba(0,0,0,0.18);
            transition: transform var(--dur-fast) var(--ease-out-expo),
                        box-shadow var(--dur-fast) var(--ease-out-expo);
        }
        input[type=range].lr-range:hover::-webkit-slider-thumb { transform: scale(1.12); }
        input[type=range].lr-range:active::-webkit-slider-thumb {
            transform: scale(0.96);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 2px 6px -1px rgba(0,0,0,0.2);
        }
        input[type=range].lr-range::-moz-range-track {
            height: 4px;
            border-radius: 999px;
            background: #e2e2e2;
        }
        input[type=range].lr-range::-moz-range-progress {
            height: 4px;
            border-radius: 999px;
            background: var(--ink);
        }
        input[type=range].lr-range::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 999px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 1px 2px rgba(0,0,0,0.14), 0 4px 12px -2px rgba(0,0,0,0.18);
        }

        /* ---------- Form fields: underline grows from the left on focus ---------- */
        .lr-field { position: relative; }
        .lr-input {
            width: 100%;
            padding: 0.75rem 0;
            background: transparent;
            color: var(--ink);
            border: 0;
            border-bottom: 1px solid var(--line);
            transition: border-color var(--dur-base) var(--ease-out-expo);
        }
        .lr-input::placeholder { color: #d4d4d4; }
        .lr-input:focus { outline: none; border-bottom-color: #c9c9c9; }
        /* The focus rule is a separate layer so it can wipe in rather than snap. */
        .lr-field::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            height: 1px;
            width: 100%;
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform var(--dur-base) var(--ease-out-expo);
            pointer-events: none;
        }
        .lr-field:focus-within::after { transform: scaleX(1); }
        /* Keyboard focus is already signalled by the rule; no double ring here. */
        .lr-input:focus-visible { outline: none; }

        /* ---------- Boot screen: hides the Tailwind/Babel compile flash ---------- */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: grid;
            place-items: center;
            background: #ffffff;
            transition: opacity 700ms var(--ease-out-expo), visibility 700ms;
        }
        #boot.is-done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #boot .boot-mark {
            width: 116px;
            opacity: 0;
            animation: boot-breathe 2.2s var(--ease-out-expo) 120ms infinite;
        }
        #boot .boot-rule {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 1px;
            width: 100%;
            background: rgba(17, 17, 17, 0.06);
            overflow: hidden;
        }
        #boot .boot-rule::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--ink);
            transform-origin: left center;
            animation: boot-progress 2.4s var(--ease-out-expo) forwards;
        }
        #boot-fallback {
            position: absolute;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            max-width: 32ch;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
            color: #8a8a8a;
            opacity: 0;
            transition: opacity var(--dur-slow) var(--ease-out-expo);
        }
        #boot-fallback.is-visible { opacity: 1; }
        @keyframes boot-breathe {
            0%, 100% { opacity: 0.18; }
            50% { opacity: 0.5; }
        }
        @keyframes boot-progress {
            0% { transform: scaleX(0); }
            60% { transform: scaleX(0.72); }
            100% { transform: scaleX(1); }
        }

        /* ---------- Scroll progress hairline ---------- */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 50;
            transform-origin: 0% 50%;
            background: linear-gradient(90deg, var(--ink), var(--clay));
            pointer-events: none;
        }

        /* ---------- Shared surfaces ---------- */
        .panel-glass {
            background: rgba(255, 255, 255, 0.82);
            -webkit-backdrop-filter: blur(48px) saturate(160%);
            backdrop-filter: blur(48px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 40px 120px -20px rgba(0, 0, 0, 0.22),
                        0 8px 24px -8px rgba(0, 0, 0, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        /* =========================================================
           REDUCED MOTION — one global switch
           ========================================================= */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
            #boot .boot-mark { opacity: 0.35; }
        }

        /* =========================================================
           LIQUID-GLASS ESTIMATOR BUTTON
           Same material language as the nav pill and modal panels;
           the travelling highlight is clay/champagne, not neon, so the
           page keeps its "colour only through the product" rule.
           ========================================================= */

        @keyframes border-travel {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .liquid-estimator-fab {
            position: fixed;
            right: 1.5rem;
            bottom: 1.5rem;
            z-index: 40;
            height: 56px;
            min-width: 72px;
            padding: 0 18px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;

            /* Clean frosted white glass with a hairline edge */
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(17, 17, 17, 0.07);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            backdrop-filter: blur(24px) saturate(180%);
            box-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.16),
                        0 2px 6px -2px rgba(0, 0, 0, 0.06),
                        inset 0 1px 0 rgba(255, 255, 255, 0.9),
                        inset 0 -1px 0 rgba(17, 17, 17, 0.04);

            transition: background var(--dur-base) var(--ease-out-expo),
                        border-color var(--dur-base) var(--ease-out-expo),
                        box-shadow var(--dur-base) var(--ease-out-expo);
            will-change: transform;
        }

        .liquid-estimator-fab:hover {
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(17, 17, 17, 0.12);
            box-shadow: 0 20px 44px -12px rgba(0, 0, 0, 0.2),
                        0 3px 8px -2px rgba(0, 0, 0, 0.08),
                        inset 0 1px 0 rgba(255, 255, 255, 1),
                        inset 0 -1px 0 rgba(17, 17, 17, 0.05);
        }

        /* Strict border mask so the highlight rides the edge only */
        .clean-border-glow {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            padding: 1.5px; /* border line thickness */
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--dur-slow) var(--ease-out-expo);
            overflow: hidden;
        }

        .clean-border-glow::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: conic-gradient(from 0deg,
                        transparent 62%,
                        rgba(184, 95, 77, 0.35) 82%,
                        rgba(214, 158, 122, 0.75) 93%,
                        rgba(255, 255, 255, 0.95) 100%);
            animation: border-travel 1.6s linear infinite;
        }

        /* Soft inner wash under the frosted glass */
        .clean-inner-glow {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--dur-slow) var(--ease-out-expo);
            overflow: hidden;
        }

        .clean-inner-glow::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: conic-gradient(from 0deg,
                        transparent 62%,
                        rgba(184, 95, 77, 0.1) 85%,
                        rgba(214, 158, 122, 0.18) 95%,
                        rgba(255, 255, 255, 0.3) 100%);
            animation: border-travel 1.6s linear infinite;
            filter: blur(10px);
        }

        /* Activation state controlled precisely by React */
        .liquid-estimator-fab.is-glowing .clean-border-glow,
        .liquid-estimator-fab.is-glowing .clean-inner-glow {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .clean-border-glow, .clean-inner-glow { display: none; }
        }
    </style>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body>
    <!-- Boot screen. Tailwind's CDN build and Babel's in-browser transform both
         finish after first paint, which would otherwise show a flash of raw,
         unstyled markup. This holds a clean white frame until React mounts. -->
    <div id="boot">
        <img class="boot-mark" src="./logo.svg" alt="" aria-hidden="true">
        <p id="boot-fallback">Still loading. If this persists, check your connection — the studio site pulls its libraries from a CDN.</p>
        <div class="boot-rule"></div>
    </div>

    <noscript>
        <div style="max-width:34rem;margin:22vh auto;padding:0 1.5rem;font-family:Inter,system-ui,sans-serif;text-align:center;color:#111">
            <img src="./logo.svg" alt="LionRenders" style="height:44px;margin:0 auto 2rem;display:block">
            <h1 style="font-size:1.5rem;font-weight:500;letter-spacing:-0.02em;margin:0 0 .75rem">JavaScript required</h1>
            <p style="color:#777;line-height:1.7;margin:0 0 2rem">This portfolio relies on JavaScript for its gallery and estimator. Please enable it, or reach us directly.</p>
            <a href="mailto:studio@lionrenders.com" style="color:#111;font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px;text-decoration:none">studio@lionrenders.com</a>
        </div>
    </noscript>

    <div id="root"></div>

    <script>
        // Surface a message if the CDN libraries never arrive, instead of
        // leaving the visitor on a blank white page forever.
        (function () {
            var el = document.getElementById('boot-fallback');
            setTimeout(function () {
                if (!document.getElementById('boot').classList.contains('is-done') && el) {
                    el.classList.add('is-visible');
                }
            }, 6000);
        })();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const { motion, AnimatePresence, useReducedMotion, useAnimationFrame, useScroll, useMotionValueEvent, useMotionValue, useSpring, useTransform } = window.Motion;

        // --- ICONS ---
        const ArrowUpRight = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>;
        const ArrowDown = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>;
        const Check = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>;
        const Menu = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>;
        const X = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const Clock = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const Zap = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const Box = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>;
        const Video = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="10" x="2" y="7" rx="2"/><path d="m16 10 4-2v8l-4-2"/></svg>;
        const Building = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>;
        const Layers = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
        const CalculatorIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;

        // --- LOGO ---
        // Intrinsic dimensions let the browser reserve the right box before the
        // SVG lands, so the nav doesn't reflow on first paint.
        const LionLogo = ({className="", alt="LionRenders"}) => (
            <img
                src="./logo.svg"
                alt={alt}
                width="635"
                height="233"
                decoding="async"
                className={`site-logo ${className}`.trim()}
            />
        );
        
        function AnimatedNumber({ value }) {
            const ref = useRef(null);
            const initial = useRef(value);
            const prefersReducedMotion = useReducedMotion();
            const motionValue = useMotionValue(value);
            const springValue = useSpring(motionValue, { stiffness: 140, damping: 24, mass: 0.6 });

            useEffect(() => {
                if (prefersReducedMotion) {
                    if (ref.current) ref.current.textContent = Math.round(value).toLocaleString();
                    return;
                }
                motionValue.set(value);
            }, [value, motionValue, prefersReducedMotion]);

            useMotionValueEvent(springValue, "change", (latest) => {
                if (ref.current) {
                    ref.current.textContent = Math.round(latest).toLocaleString();
                }
            });

            // Rendered once with the mount value; the spring owns the text node from
            // then on. Re-rendering here would snap the number to its target for a
            // frame before the spring caught up.
            return <span ref={ref} className="tnum">{initial.current.toLocaleString()}</span>;
        }

        // --- DATA ---
        const PROJECTS = [
            { id: "aether-house", title: "Aether house", category: "Architecture", discipline: "Architectural visualisation", ratio: "wide", src: "https://picsum.photos/seed/aether/1600/1000", alt: "Cinematic concrete residence at dusk" },
            { id: "serein-no-7", title: "Serein no. 7", category: "Fragrance", discipline: "Product CGI", ratio: "tall", src: "https://picsum.photos/seed/serein/1000/1500", alt: "Luxury fragrance bottle on translucent stone" },
            { id: "forma-one", title: "Forma chair", category: "Furniture", discipline: "Creative direction", ratio: "square", src: "https://picsum.photos/seed/forma/1200/1200", alt: "Sculptural lounge chair in a soft set" },
            { id: "halcyon-hypercar", title: "Halcyon GT", category: "Automotive", discipline: "Launch film", ratio: "panorama", src: "https://picsum.photos/seed/halcyon/1800/900", alt: "Concept vehicle crossing atmospheric desert" },
            { id: "nacre-jewelry", title: "Nacre fine ring", category: "Jewellery", discipline: "Macro imagery", ratio: "tall", src: "https://picsum.photos/seed/nacre/1000/1400", alt: "Pearl and platinum jewellery close-up" },

        ];

        const PROCESS_STEPS = [
            { step: "01", title: "Briefing & CAD models", desc: "Send us your CAD files, sketches, or physical prototypes along with brand guidelines and material specs." },
            { step: "02", title: "Clay model & cameras", desc: "We establish digital geometry, camera framing, and composition for initial sign-off." },
            { step: "03", title: "Materials & lighting", desc: "Creation of high-resolution PBR textures, bespoke lighting, and realistic environment integration." },
            { step: "04", title: "Review & refinement", desc: "Collaborative review rounds to fine-tune reflections, environmental mood, and subtle micro-details." },
            { step: "05", title: "8K master delivery", desc: "Final high-precision ray-traced rendering, post-processing color grading, and delivery in all formats." }
        ];

        const NAV_ITEMS = [
            { id: "home", label: "LionRenders" },
            { id: "work", label: "Work" },
            { id: "process", label: "Process" },
            { id: "about", label: "Studio" }
        ];

        // --- MOTION SYSTEM ---
        // One easing family and one set of springs, reused everywhere, so every
        // transition on the page feels like it came from the same hand.
        const EASE = [0.16, 1, 0.3, 1];          // out-expo, matches --ease-out-expo

        const smoothTransition = { duration: 0.5, ease: EASE };

        // --- ANIMATION PHYSICS ---
        const genieSpring = { type: "spring", damping: 24, stiffness: 260, mass: 0.7 };
        const fluidFlight = { duration: 0.6, ease: EASE };
        const categoryFlight = { type: "spring", damping: 26, stiffness: 280, mass: 0.8 };
        const hoverSpring = { type: "spring", stiffness: 380, damping: 30, mass: 0.6 };
        const segmentSpring = { type: "spring", stiffness: 500, damping: 38, mass: 0.7 };
        const revealTransition = { duration: 0.8, ease: EASE };

        // =========================================================
        //  SHARED BEHAVIOUR
        // =========================================================

        // Ref-counted body scroll lock. The expanded gallery and the modals can
        // both be open at once; without counting, whichever closed first would
        // release the lock and let the page scroll behind the other.
        const scrollLock = (() => {
            let count = 0;
            return {
                acquire() {
                    if (count++ === 0) document.body.style.overflow = "hidden";
                },
                release() {
                    count = Math.max(0, count - 1);
                    if (count === 0) document.body.style.overflow = "";
                }
            };
        })();

        function useScrollLock(active) {
            useEffect(() => {
                if (!active) return;
                scrollLock.acquire();
                return () => scrollLock.release();
            }, [active]);
        }

        const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])';

        // Escape to close, focus moved in and trapped, focus returned to whatever
        // opened the dialog. Applied to every overlay so they behave identically.
        function useDialog(isOpen, onClose) {
            const panelRef = useRef(null);
            const restoreRef = useRef(null);
            useScrollLock(isOpen);

            useEffect(() => {
                if (!isOpen) return;
                restoreRef.current = document.activeElement;

                const focusTimer = setTimeout(() => {
                    const node = panelRef.current;
                    if (!node) return;
                    const target = node.querySelector('[data-autofocus]') || node.querySelector(FOCUSABLE);
                    if (target) target.focus({ preventScroll: true });
                }, 80);

                const onKeyDown = (e) => {
                    if (e.key === "Escape") {
                        e.preventDefault();
                        onClose();
                        return;
                    }
                    if (e.key !== "Tab") return;
                    const node = panelRef.current;
                    if (!node) return;
                    const items = Array.from(node.querySelectorAll(FOCUSABLE))
                        .filter((el) => el.offsetWidth > 0 || el.offsetHeight > 0);
                    if (!items.length) return;
                    const first = items[0];
                    const last = items[items.length - 1];
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                };

                document.addEventListener("keydown", onKeyDown);
                return () => {
                    clearTimeout(focusTimer);
                    document.removeEventListener("keydown", onKeyDown);
                    const prev = restoreRef.current;
                    if (prev && typeof prev.focus === "function") prev.focus({ preventScroll: true });
                };
            }, [isOpen, onClose]);

            return panelRef;
        }

        // Scroll-triggered entrance. Sections arrive rather than simply existing.
        function Reveal({ children, delay = 0, y = 28, amount = 0.3, className = "", as = "div" }) {
            const prefersReducedMotion = useReducedMotion();
            const Component = motion[as] || motion.div;

            if (prefersReducedMotion) {
                const Plain = as;
                return <Plain className={className}>{children}</Plain>;
            }

            return (
                <Component
                    className={className}
                    initial={{ opacity: 0, y }}
                    whileInView={{ opacity: 1, y: 0 }}
                    viewport={{ once: true, amount }}
                    transition={{ ...revealTransition, delay }}
                >
                    {children}
                </Component>
            );
        }

        // Images fade up rather than snapping in as each one decodes.
        // Inline styles so Tailwind's `transition-*` utilities can't override the
        // fade, and so nothing competes with Framer's layout transforms.
        function ProjectImage({ className = "", style = {}, hovered = false, ...rest }) {
            const [loaded, setLoaded] = useState(false);
            const prefersReducedMotion = useReducedMotion();

            const attachRef = (el) => {
                if (el && el.complete && el.naturalWidth > 0 && !loaded) setLoaded(true);
            };

            const visible = loaded || prefersReducedMotion;

            return (
                <motion.img
                    ref={attachRef}
                    onLoad={() => setLoaded(true)}
                    onError={() => setLoaded(true)}
                    className={className}
                    style={{
                        ...style,
                        opacity: visible ? 1 : 0,
                        filter: hovered ? "grayscale(0%)" : "grayscale(32%)",
                        transition: prefersReducedMotion
                            ? "none"
                            : "opacity 700ms cubic-bezier(0.16,1,0.3,1), filter 600ms cubic-bezier(0.16,1,0.3,1)"
                    }}
                    {...rest}
                />
            );
        }

        // Reusable Category Filters to support animating from Page to Full-screen Header
        const CategoryFilters = ({ categories, filter, setFilter }) => (
            <>
                {categories.map((cat) => {
                    const isActive = filter === cat;
                    return (
                        <motion.button
                            layout
                            transition={categoryFlight}
                            layoutId={`filter-btn-${cat}`}
                            key={cat}
                            aria-pressed={isActive}
                            onClick={(e) => { e.stopPropagation(); setFilter(cat); }}
                            className={`relative px-5 py-2 rounded-full text-xs font-semibold tracking-wide transition-colors duration-300 ${isActive ? "text-white" : "text-gray-600 hover:text-black"}`}
                        >
                            {/* Shared pill glides between categories instead of each
                                button flipping its own background on and off. */}
                            {isActive && (
                                <motion.span
                                    layoutId="filter-active-pill"
                                    transition={categoryFlight}
                                    className="absolute inset-0 rounded-full bg-black"
                                    style={{ zIndex: -1 }}
                                />
                            )}
                            {!isActive && (
                                <span className="absolute inset-0 rounded-full bg-transparent hover:bg-gray-200/70 transition-colors duration-300" style={{ zIndex: -1 }} />
                            )}
                            <span className="relative">{cat}</span>
                        </motion.button>
                    );
                })}
            </>
        );

        // --- KINETIC GALLERY ENGINE ---
        function KineticEngine({ items, onProjectClick, interactive, paused, previewProject }) {
            const containerRef = useRef(null);
            const wrapperRef = useRef(null);
            const prefersReducedMotion = useReducedMotion();
            const yPos = useRef(0);
            const currentVelocity = useRef(-0.3);
            const targetVelocity = useRef(-0.3);
            const isDragging = useRef(false);
            const [hoveredId, setHoveredId] = useState(null);
            const [isOnScreen, setIsOnScreen] = useState(true);

            // Don't burn frames animating a gallery nobody can see.
            useEffect(() => {
                const node = containerRef.current;
                if (!node || typeof IntersectionObserver === "undefined") return;
                const observer = new IntersectionObserver(
                    ([entry]) => setIsOnScreen(entry.isIntersecting),
                    { rootMargin: "200px" }
                );
                observer.observe(node);
                return () => observer.disconnect();
            }, []);

            // A card can't stay "hovered" once the pointer is gone or the view changed.
            useEffect(() => {
                if (!interactive || paused) setHoveredId(null);
            }, [interactive, paused]);

            useAnimationFrame((t, delta) => {
                if (prefersReducedMotion || !wrapperRef.current || paused || !isOnScreen) return;

                // Frame-rate independent: a 144Hz display shouldn't scroll 2.4x
                // faster than a 60Hz one.
                const frameScale = Math.min(delta, 50) / 16.667;

                let vDelta = (targetVelocity.current - currentVelocity.current) * Math.min(1, 0.05 * frameScale);
                if (isNaN(vDelta)) vDelta = 0;

                currentVelocity.current += vDelta;
                yPos.current += currentVelocity.current * frameScale;

                if (isNaN(yPos.current)) yPos.current = 0;

                const scrollHeight = wrapperRef.current.scrollHeight / 2;
                if (scrollHeight > 0) {
                    if (yPos.current <= -scrollHeight) {
                        yPos.current += scrollHeight;
                    } else if (yPos.current > 0) {
                        yPos.current -= scrollHeight;
                    }
                    wrapperRef.current.style.transform = `translate3d(0, ${yPos.current}px, 0)`;
                }
            });

            const handlePointerMove = (e) => {
                if (prefersReducedMotion || isDragging.current || !containerRef.current || !interactive || paused) return;
                const rect = containerRef.current.getBoundingClientRect();
                if (rect.height === 0) return; 
                
                const relativeY = e.clientY - rect.top;
                const normalizedY = (relativeY / rect.height) * 2 - 1;

                // Dead zone through the middle so small pointer jitter near the
                // centre doesn't make the wall twitch back and forth.
                const shaped = Math.abs(normalizedY) < 0.12 ? 0 : normalizedY;

                let speed = (shaped * 1.5) - 0.3;
                if (isNaN(speed)) speed = -0.3;

                targetVelocity.current = Math.max(-2.4, Math.min(2.4, speed));
            };

            const handlePointerLeave = () => {
                if (prefersReducedMotion || !interactive || paused) return;
                isDragging.current = false;
                targetVelocity.current = -0.3;
            };

            const handleWheel = (e) => {
                if (prefersReducedMotion || !interactive || paused) return;
                yPos.current -= e.deltaY * 0.6;
            };

            const getSpanClass = (ratio) => {
                switch (ratio) {
                    case "wide": return "col-span-1 md:col-span-2 row-span-1";
                    case "tall": return "col-span-1 row-span-2";
                    case "panorama": return "col-span-1 md:col-span-3 row-span-1";
                    case "square": default: return "col-span-1 row-span-1";
                }
            };

            const renderMosaicGrid = (isDuplicate = false) => (
                <div className={`grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 grid-flow-dense gap-3 md:gap-5 px-4 md:px-8 pb-8 ${interactive ? 'pt-32' : 'pt-4 md:pt-8'}`}>
                    {items.map((item, idx) => {
                        const isCurrentPreview = previewProject && previewProject.id === item.id && !isDuplicate;

                        if (isCurrentPreview) return null;

                        const cardKey = isDuplicate ? `dup-${item.id}-${idx}` : item.id;
                        const isHovered = hoveredId === cardKey;

                        return (
                            <motion.article
                                layout
                                layoutId={!isDuplicate ? `card-wrapper-${item.id}` : undefined}
                                transition={fluidFlight}
                                key={cardKey}
                                onPointerEnter={() => interactive && setHoveredId(cardKey)}
                                onPointerLeave={() => interactive && setHoveredId((c) => (c === cardKey ? null : c))}
                                onClick={(e) => {
                                    if (interactive) {
                                        e.stopPropagation();
                                        onProjectClick(item, e);
                                    }
                                }}
                                className={`group relative ${interactive ? "cursor-pointer" : ""} ${getSpanClass(item.ratio)}`}
                            >
                                <div className="relative w-full h-full min-h-[320px] md:min-h-[420px]">
                                    <ProjectImage
                                        layoutId={!isDuplicate ? `image-${item.id}` : undefined}
                                        transition={fluidFlight}
                                        hovered={isHovered}
                                        src={item.src} alt={item.alt} loading="lazy" decoding="async"
                                        className="h-full w-full object-cover rounded-[20px] shadow-sm bg-gray-200"
                                    />

                                    {/* Caption sits on a gradient scrim rather than a flat wash,
                                        so the image stays readable underneath it. */}
                                    <div
                                        className="absolute inset-0 p-6 flex flex-col justify-end text-white pointer-events-none rounded-[20px]"
                                        style={{
                                            background: "linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.32) 34%, rgba(0,0,0,0) 68%)",
                                            opacity: isHovered ? 1 : 0,
                                            transition: "opacity 520ms cubic-bezier(0.16,1,0.3,1)"
                                        }}
                                    >
                                        <span
                                            className="text-[10px] font-bold uppercase tracking-[0.2em] text-white/75 mb-2"
                                            style={{
                                                transform: isHovered ? "translateY(0)" : "translateY(10px)",
                                                transition: "transform 560ms cubic-bezier(0.16,1,0.3,1) 40ms"
                                            }}
                                        >
                                            {item.category}
                                        </span>
                                        <h3
                                            className="text-xl font-medium tracking-tight text-white"
                                            style={{
                                                transform: isHovered ? "translateY(0)" : "translateY(14px)",
                                                transition: "transform 560ms cubic-bezier(0.16,1,0.3,1) 80ms"
                                            }}
                                        >
                                            {item.title}
                                        </h3>
                                    </div>
                                </div>
                            </motion.article>
                        );
                    })}
                </div>
            );

            return (
                <div 
                    ref={containerRef} 
                    onPointerMove={handlePointerMove} 
                    onPointerLeave={handlePointerLeave} 
                    onWheel={handleWheel}
                    className="relative w-full h-full overflow-hidden"
                >
                    {/* Collapsed state: white fades top and bottom so the wall
                        dissolves into the page instead of ending on a hard edge. */}
                    <motion.div animate={{ opacity: interactive ? 0 : 1 }} transition={{ duration: 0.5, ease: EASE }} style={{ background: 'linear-gradient(to bottom, #ffffff 0%, rgba(255,255,255,0.85) 30%, rgba(255,255,255,0) 100%)' }} className="absolute top-0 left-0 right-0 h-32 sm:h-56 z-20 pointer-events-none" />
                    <motion.div animate={{ opacity: interactive ? 0 : 1 }} transition={{ duration: 0.5, ease: EASE }} style={{ background: 'linear-gradient(to top, #ffffff 0%, rgba(255,255,255,0.85) 30%, rgba(255,255,255,0) 100%)' }} className="absolute bottom-0 left-0 right-0 h-32 sm:h-56 z-20 pointer-events-none" />

                    {/* Expanded state: a soft light scrim keeps the floating filter
                        bar and close button readable over dark imagery. */}
                    <motion.div
                        initial={false}
                        animate={{ opacity: interactive ? 1 : 0 }}
                        transition={{ duration: 0.5, ease: EASE }}
                        style={{ background: 'linear-gradient(to bottom, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.28) 45%, rgba(255,255,255,0) 100%)' }}
                        className="absolute top-0 left-0 right-0 h-40 z-20 pointer-events-none"
                    />

                    <div ref={wrapperRef} className={`w-full will-change-transform ${prefersReducedMotion ? "overflow-y-auto h-full no-scrollbar" : ""}`}>
                        {renderMosaicGrid(false)}
                        {!prefersReducedMotion && renderMosaicGrid(true)}
                    </div>
                </div>
            );
        }

        // --- COMPONENTS ---
        // Hairline reading-position indicator across the top of the page.
        function ScrollProgress() {
            const { scrollYProgress } = useScroll();
            const scaleX = useSpring(scrollYProgress, { stiffness: 180, damping: 30, restDelta: 0.001 });
            const prefersReducedMotion = useReducedMotion();
            return (
                <motion.div
                    className="scroll-progress"
                    style={{ scaleX: prefersReducedMotion ? scrollYProgress : scaleX }}
                    aria-hidden="true"
                />
            );
        }

        function Header({ activeSection, scrollTo, openContact }) {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const { scrollY } = useScroll();
            const [isScrolled, setIsScrolled] = useState(false);
            const menuRef = useRef(null);

            useMotionValueEvent(scrollY, "change", (latest) => {
                setIsScrolled(latest > 20);
            });

            // The mobile sheet closes the way people expect it to: Escape,
            // a tap outside, or scrolling the page away from it.
            useEffect(() => {
                if (!mobileMenuOpen) return;
                const onKey = (e) => { if (e.key === "Escape") setMobileMenuOpen(false); };
                const onPointerDown = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target)) setMobileMenuOpen(false);
                };
                const onScroll = () => setMobileMenuOpen(false);
                document.addEventListener("keydown", onKey);
                document.addEventListener("pointerdown", onPointerDown);
                window.addEventListener("scroll", onScroll, { passive: true });
                return () => {
                    document.removeEventListener("keydown", onKey);
                    document.removeEventListener("pointerdown", onPointerDown);
                    window.removeEventListener("scroll", onScroll);
                };
            }, [mobileMenuOpen]);

            return (
                <header ref={menuRef} className="fixed top-0 left-0 right-0 z-40 flex justify-center pointer-events-none">
                    <motion.nav
                        layout
                        initial={false}

                            y: isScrolled ? 0 : 24,

                            backgroundColor: isScrolled ? "rgba(255, 255, 255, 0.92)" : "rgba(255, 255, 255, 0.82)",
                            boxShadow: isScrolled
                                ? "0px 1px 0px rgba(17,17,17,0.07), 0px 10px 30px -18px rgba(0,0,0,0.28)"
                                : "0px 12px 30px -10px rgba(0,0,0,0.08), inset 0px 0px 0px 1px rgba(17,17,17,0.06)",
                        }}
                        transition={smoothTransition}
                        className={`pointer-events-auto relative flex items-center justify-between backdrop-blur-[32px] overflow-hidden ${isScrolled ? 'w-full px-6 md:px-12 py-4 gap-4' : 'w-[calc(100%-3rem)] max-w-fit pl-8 pr-2.5 py-2.5'}`}
                    >
                        <motion.button 
                            layout 
                            transition={smoothTransition}

                            className="flex items-center justify-center shrink-0 cursor-pointer select-none"

                        <motion.div layout transition={smoothTransition} className={`hidden md:flex items-center relative ${isScrolled ? 'gap-1 mx-4' : 'gap-2 lg:gap-4 mx-8 lg:mx-14'}`}>
                            {NAV_ITEMS.slice(1).map((item) => {
                                const isActive = activeSection === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => scrollTo(item.id)}
                                        aria-current={isActive ? "true" : undefined}
                                        className={`relative px-5 py-2.5 rounded-full text-sm font-medium transition-colors duration-300 ${
                                            isActive ? "text-black" : "text-gray-500 hover:text-black"
                                        }`}
                                    >
                                        {isActive && (
                                            <motion.div
                                                layoutId="activeNavPill"
                                                className="absolute inset-0 bg-gray-100 rounded-full"
                                                style={{ zIndex: -1 }}
                                                transition={{ type: "spring", stiffness: 420, damping: 34, mass: 0.7 }}
                                            />
                                        )}
                                        <span className="relative z-10">{item.label}</span>
                                    </button>
                                );
                            })}

                        <motion.div layout transition={smoothTransition} className={`hidden md:flex items-center shrink-0 group ${isScrolled ? 'pl-2' : 'pl-4'}`}>
                            <motion.button
                                onClick={(e) => openContact(null, e)}
                                whileHover={{ scale: 1.03 }}
                                whileTap={{ scale: 0.98 }}
                                transition={hoverSpring}
                                className="flex items-center gap-2 px-6 py-3 rounded-full bg-black text-white text-sm font-medium hover:bg-[#b85f4d] hover:shadow-[0_8px_24px_-6px_rgba(184,95,77,0.55)] transition-[background-color,box-shadow] duration-300 ease-out-expo"
                            >
                                Start project <ArrowUpRight size={14} className="transition-transform duration-300 ease-out-expo group-hover:translate-x-0.5 group-hover:-translate-y-0.5" />
                            </motion.button>
                        </motion.div>

                        <motion.button
                            layout
                            transition={smoothTransition}
                            onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                            className={`grid h-10 w-10 place-items-center rounded-full bg-gray-100 text-black md:hidden pointer-events-auto shrink-0 hover:bg-gray-200 transition-colors duration-300 ${isScrolled ? '' : 'mr-1'}`}
                            aria-label={mobileMenuOpen ? "Close menu" : "Open menu"}
                            aria-expanded={mobileMenuOpen}
                            aria-controls="mobile-menu"
                        >
                            <AnimatePresence mode="wait" initial={false}>
                                <motion.span
                                    key={mobileMenuOpen ? "close" : "open"}
                                    initial={{ opacity: 0, rotate: -80, scale: 0.7 }}
                                    animate={{ opacity: 1, rotate: 0, scale: 1 }}
                                    exit={{ opacity: 0, rotate: 80, scale: 0.7 }}
                                    transition={{ duration: 0.22, ease: EASE }}
                                    className="grid place-items-center"
                                >
                                    {mobileMenuOpen ? <X size={18} /> : <Menu size={18} />}
                                </motion.span>
                            </AnimatePresence>
                        </motion.button>
                    </motion.nav>

                    <AnimatePresence>
                        {mobileMenuOpen && (
                            <motion.div
                                id="mobile-menu"
                                initial={{ opacity: 0, y: -14, scale: 0.97 }}
                                animate={{ opacity: 1, y: 0, scale: 1 }}
                                exit={{ opacity: 0, y: -10, scale: 0.98, transition: { duration: 0.2, ease: EASE } }}
                                transition={{ duration: 0.42, ease: EASE }}
                                                className={`pointer-events-auto absolute left-4 right-4 p-4 rounded-3xl bg-white/[0.97] backdrop-blur-2xl border border-gray-100 shadow-[0_24px_80px_rgba(0,0,0,0.12)] md:hidden ${isScrolled ? 'top-20' : 'top-28'}`}
                            >
                                <div className="flex flex-col gap-1">
                                    {NAV_ITEMS.map((item, i) => (
                                        <motion.button
                                            key={item.id}
                                            initial={{ opacity: 0, y: -6 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            transition={{ duration: 0.36, ease: EASE, delay: 0.04 + i * 0.045 }}
                                            onClick={() => { scrollTo(item.id); setMobileMenuOpen(false); }}
                                            aria-current={activeSection === item.id ? "true" : undefined}
                                            className={`px-4 py-3 text-left rounded-2xl text-[15px] font-medium transition-colors duration-300 ${activeSection === item.id ? 'bg-gray-50 text-black' : 'text-gray-600 hover:bg-gray-50 hover:text-black'}`}
                                        >
                                            {item.id === 'home' ? 'LionRenders' : item.label}

        function CalculatorModal({ isOpen, onClose, openContact, origin }) {
            const [type, setType] = useState('product'); 
            const [views, setViews] = useState(3);
            const [quality, setQuality] = useState('standard'); 
            const [speed, setSpeed] = useState('standard'); 

            const estimate = useMemo(() => {
                let basePerView = 900;
                let daysBase = 5;

                if (type === 'motion') { basePerView = 2400; daysBase = 10; }
                else if (type === 'spatial') { basePerView = 1200; daysBase = 7; }
                else if (type === 'interactive') { basePerView = 1600; daysBase = 8; }

                let qualityMultiplier = 1.0;
                if (quality === 'campaign') qualityMultiplier = 1.35;
                if (quality === 'cinematic') qualityMultiplier = 1.75;

                let speedMultiplier = speed === 'express' ? 1.4 : 1.0;
                let daysMultiplier = speed === 'express' ? 0.6 : 1.0;

                const rawCost = basePerView * views * qualityMultiplier * speedMultiplier;
                const estimatedDays = Math.max(2, Math.round((daysBase + (views * 0.8)) * daysMultiplier));

                return {
                    lowerCost: Math.round(rawCost * 0.9),
                    upperCost: Math.round(rawCost * 1.15),
                    days: estimatedDays
                };
            }, [type, views, quality, speed]);

            const originX = typeof window !== 'undefined' ? (origin.x / window.innerWidth) * 100 + '%' : '50%';
            const originY = typeof window !== 'undefined' ? (origin.y / window.innerHeight) * 100 + '%' : '50%';

            const panelRef = useDialog(isOpen, onClose);

                                    whileTap={{ scale: 0.94 }}
                                    transition={hoverSpring}

                                    <X size={18} />

                                    estimate stays pinned in view on small screens. */}

                                        line on phones so the CTA stays reachable. */}
                                    <div className="hidden lg:block space-y-4 text-sm border-t border-gray-200 pt-8">
                                        <div className="flex justify-between items-center gap-4"><span className="text-gray-500 text-xs uppercase font-bold tracking-widest">Base setup</span><span className="font-mono text-black">Included</span></div>
                                        <div className="flex justify-between items-center gap-4"><span className="text-gray-500 text-xs uppercase font-bold tracking-widest">Assets</span><span className="font-mono text-black tnum">{views}x</span></div>
                                        <div className="flex justify-between items-center gap-4"><span className="text-gray-500 text-xs uppercase font-bold tracking-widest">Tier</span><span className="font-mono text-black capitalize">{quality}</span></div>
                                        <div className="flex justify-between items-center gap-4"><span className="text-gray-500 text-xs uppercase font-bold tracking-widest">Timeline</span><span className="font-mono text-black tnum">~<AnimatedNumber value={estimate.days} /> Days</span></div>
                                    </div>

                                    <div className="lg:hidden border-t border-gray-200 pt-5 text-xs font-mono text-gray-500 flex flex-wrap items-center gap-x-2 gap-y-1">
                                        <span className="text-black tnum">{views}x</span>
                                        <span className="text-gray-300">/</span>
                                        <span className="text-black capitalize">{quality}</span>
                                        <span className="text-gray-300">/</span>
                                        <span className="text-black tnum">~<AnimatedNumber value={estimate.days} /> days</span>
                                    </div>

                                    <motion.button
                                        onClick={(e) => {
                                            onClose();
                                            openContact({ type: 'estimate', lowerCost: estimate.lowerCost, upperCost: estimate.upperCost, days: estimate.days, config: { type, views, quality, speed } }, e);
                                        }}
                                        whileHover={{ scale: 1.02 }}
                                        whileTap={{ scale: 0.98 }}

                                    >

                                </div>
                            </motion.div>
                        </motion.div>
                    )}

        function ProjectDetailModal({ project, onClose, openContact }) {

                            <h3 id={`project-title-${project.id}`} className="text-3xl sm:text-4xl font-medium tracking-[-0.03em] text-black mt-2">{project.title}</h3>

                                whileTap={{ scale: 0.98 }}
                                transition={hoverSpring}
                                className="mt-8 py-4 rounded-full bg-black text-white text-xs font-bold uppercase tracking-widest hover:bg-[#b85f4d] hover:shadow-[0_10px_30px_-8px_rgba(184,95,77,0.6)] transition-[background-color,box-shadow] duration-300 ease-out-expo group"
                            >
